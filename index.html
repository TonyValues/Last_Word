<!doctype html>
<html lang="he" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>המילה האחרונה</title>

  <link
    rel="stylesheet"
    href="style.css?v=3"
  >

</head>


<body>

<main class="app">


  <!-- HEADER -->

  <header class="topbar">

    <div>

      <div class="eyebrow">
        משחק ניחושים
      </div>

      <h1>
        המילה האחרונה
      </h1>

    </div>


    <button
      id="newGameBtn"
      class="secondary"
      type="button"
    >
      משחקים קודמים
    </button>

  </header>


  <!-- PREVIOUS GAMES -->

  <section
    id="gameSelector"
    class="card game-selector hidden"
  >

    <div class="eyebrow">
      ארכיון
    </div>

    <h2>
      משחקים קודמים
    </h2>

    <div
      id="gameList"
      class="game-list"
    ></div>

  </section>


  <!-- INTRO -->

  <section
    id="intro"
    class="card intro-card"
  >

    <div class="hero-icon">
      ?
    </div>

    <h2 id="introTitle">
      כמה מילים תצטרך?
    </h2>

    <p id="introText">
     המטרה: לנחש את המילה האחרונה
     בכמה שפחות ניחושים.
      בכל ניחוש שגוי תיחשף מילה נוספת
    </p>

    <button
      id="startBtn"
      class="primary"
      type="button"
    >
      התחל משחק
    </button>

    <div class="player-summary" aria-label="הסטטיסטיקה שלך">
      <div>
        <strong id="gamesPlayed">0</strong>
        <span>משחקים</span>
      </div>
      <div>
        <strong id="gamesWon">0</strong>
        <span>ניצחונות</span>
      </div>
    </div>

  </section>


  <!-- GAME -->

  <section
    id="game"
    class="game hidden"
  >

    <div class="game-meta">

      <span id="gameNumber">
        משחק #001
      </span>

      <span id="gameDate">
      </span>

      <span id="revealedCount">
        1 / 5 מילים נחשפו
      </span>

    </div>


    <section class="card words-card">

      <div
        id="words"
        class="words"
      ></div>

    </section>


    <section class="card guess-card">

      <label for="guess">
        מה המילה האחרונה?
      </label>


      <div class="guess-row">

        <input
          id="guess"
          autocomplete="off"
          placeholder="הקלד את הניחוש שלך"
        >


        <button
          id="guessBtn"
          class="primary"
        >
          נחש
        </button>

      </div>


      <div
        id="feedback"
        class="feedback"
        aria-live="polite"
      ></div>

      <button
        id="quitBtn"
        class="secondary quit-button"
        type="button"
      >
        וותר על המשחק
      </button>

    </section>


    <div class="stats">
      <div>
        <strong id="guesses">0</strong>
        <span>ניחושים</span>
      </div>
    </div>

  </section>


  <!-- RESULT -->

  <section
    id="result"
    class="card result hidden"
  >

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>


    <div
      class="eyebrow"
      id="resultLabel"
    >
      כל הכבוד!
    </div>


    <h2 id="resultTitle">
      מצאת את המילה
    </h2>


    <p id="resultText"></p>


    <div class="answer-box">

      <span>
        התשובה
      </span>

      <strong id="answer"></strong>

      <p
        id="answerExplanation"
        class="answer-explanation"
      ></p>

    </div>


    <button
      id="againBtn"
      class="primary"
        type="button"
    >
      לשחק שוב
    </button>

    <button
      id="shareBtn"
      class="secondary share-button"
      type="button"
    >
      שתף תוצאה
    </button>

  </section>


  <footer>
    משחק יומי · משחקים קודמים
  </footer>


</main>


<script src="app.js?v=4"></script>

</body>

</html>
