<!doctype html>
<html lang="he" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>המילה האחרונה</title>

  <link
    rel="stylesheet"
    href="style.css?v=3"
  >

</head>


<body>

<main class="app">


  <!-- HEADER -->

  <header class="topbar">

    <div>

      <div class="eyebrow">
        משחק ניחושים
      </div>

      <h1>
        המילה האחרונה
      </h1>

    </div>


    <button
      id="newGameBtn"
      class="secondary"
    >
      משחקים קודמים
    </button>

  </header>


  <!-- PREVIOUS GAMES -->

  <section
    id="gameSelector"
    class="card game-selector hidden"
  >

    <div class="eyebrow">
      ארכיון
    </div>

    <h2>
      משחקים קודמים
    </h2>

    <div
      id="gameList"
      class="game-list"
    ></div>

  </section>


  <!-- INTRO -->

  <section
    id="intro"
    class="card intro-card"
  >

    <div class="hero-icon">
      ?
    </div>

    <h2 id="introTitle">
      כמה מעט מילים תצטרך?
    </h2>

    <p id="introText">
      המילה הראשונה חשופה.
      בכל ניחוש שגוי תיחשף מילה נוספת.
      המטרה: לנחש את המילה האחרונה
      בכמה שפחות חשיפות.
    </p>

    <button
      id="startBtn"
      class="primary"
    >
      התחל משחק
    </button>

  </section>


  <!-- GAME -->

  <section
    id="game"
    class="game hidden"
  >

    <div class="game-meta">

      <span id="gameNumber">
        משחק #001
      </span>

      <span id="gameDate">
      </span>

      <span id="revealedCount">
        1 / 5 מילים נחשפו
      </span>

    </div>


    <section class="card words-card">

      <div
        id="words"
        class="words"
      ></div>

    </section>


    <section class="card guess-card">

      <label for="guess">
        מה המילה האחרונה?
      </label>


      <div class="guess-row">

        <input
          id="guess"
          autocomplete="off"
          placeholder="הקלד את הניחוש שלך"
        >


        <button
          id="guessBtn"
          class="primary"
        >
          נחש
        </button>

      </div>


      <div
        id="feedback"
        class="feedback"
        aria-live="polite"
      ></div>

    </section>


    <div class="stats">

      <div>

        <strong id="mistakes">
          0
        </strong>

        <span>
          טעויות
        </span>

      </div>


      <div>

        <strong id="score">
          100
        </strong>

        <span>
          ניקוד
        </span>

      </div>

    </div>

  </section>


  <!-- RESULT -->

  <section
    id="result"
    class="card result hidden"
  >

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>


    <div
      class="eyebrow"
      id="resultLabel"
    >
      כל הכבוד!
    </div>


    <h2 id="resultTitle">
      מצאת את המילה
    </h2>


    <p id="resultText"></p>


    <div class="answer-box">

      <span>
        התשובה
      </span>

      <strong id="answer"></strong>

    </div>


    <button
      id="againBtn"
      class="primary"
    >
      לשחק שוב
    </button>

  </section>


  <footer>
    משחק יומי · משחקים קודמים
  </footer>


</main>


<!-- IMPORTANT:
     games.js must load BEFORE app.js
-->

<script src="games.js?v=3"></script>
<script src="app.js?v=3"></script>

</body>

</html>
